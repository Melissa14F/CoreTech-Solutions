# Encabezados de seguridad (RNF-01, RNF-09, RNF-10). Se incluye en el server y en CADA location que use add_header:
# nginx descarta los add_header del nivel superior en cuanto un location define uno propio.
#
# Va en /etc/nginx/snippets/encabezados-seguridad.conf (P25 lo monta en el contenedor).

# Solo HTTPS durante un año (RNF-09). Sin «preload»: con un dominio de pruebas no se puede deshacer.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# El navegador no adivina el tipo de un archivo: un adjunto no se ejecuta como script (ver también TipoAdjunto en la API)
add_header X-Content-Type-Options "nosniff" always;

# Al salir a otro sitio solo se envía el origen, no la ruta (el enlace de restablecer lleva un token en la dirección)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Política de contenido: la SPA solo carga scripts, estilos, imágenes y conexiones propios, más las tipografías de Google
# Fonts (index.html). Nada de scripts en línea ni de eval. El portal no se puede abrir dentro de un iframe ajeno.
# El ingreso con Google o Microsoft y «Conectar con Gmail» son redirecciones de página completa: no necesitan connect-src.
# El panel de accesibilidad (RNF-07) trae su fuente para dislexia dentro del portal (public/fonts/opendyslexic): no pide nada a terceros.
# Probado con el build real (npm run build) detrás de este Nginx: sin bloqueos en la página principal ni en el panel del
# administrador (servicios, proyectos, auditoría, correo del sistema); las tipografías de Google Fonts cargan.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# Respaldo de frame-ancestors para navegadores antiguos
add_header X-Frame-Options "DENY" always;

# El portal no usa cámara, micrófono, ubicación ni pagos del navegador
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
