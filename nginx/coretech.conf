# Nginx de CoreTech (RNF-09, RNF-11): sirve la SPA, enruta /api/v1 a la API y termina HTTPS (TLS 1.2 o superior).
# Va en /etc/nginx/conf.d/coretech.conf. P25 lo monta junto con el build del frontend (/usr/share/nginx/html), los
# certificados (/etc/nginx/certs/fullchain.pem y privkey.pem) y encabezados-seguridad.conf (/etc/nginx/snippets/).

server_tokens off;   # no anunciar la versión de Nginx

# HTTP solo redirige a HTTPS
server {
    listen 80 default_server;
    server_name _;

    # Healthcheck del contenedor (el wget de Alpine no acepta certificados autofirmados, así que no usa HTTPS)
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /usr/share/nginx/html;
    index index.html;

    # Los adjuntos pesan hasta 5 MB cada uno y un paso lleva hasta 5 (la API valida cada uno con su mensaje)
    client_max_body_size 30m;

    include /etc/nginx/snippets/encabezados-seguridad.conf;

    # API: Nginx es el único borde, así que la IP real y el esquema se ponen aquí y se SOBRESCRIBE X-Forwarded-For
    # (no «$proxy_add_x_forwarded_for»): si no, quien llame podría inventar su IP y saltarse el límite de intentos
    # por IP y falsear la auditoría. La API lo lee con server.forward-headers-strategy=framework (perfil prod).
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        # Spring Security ya pone estos dos: se quitan los suyos para que no salgan repetidos junto a los del snippet
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        include /etc/nginx/snippets/encabezados-seguridad.conf;
    }

    # Archivos del build: llevan el hash en el nombre, se pueden guardar un año
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/encabezados-seguridad.conf;
    }

    # SPA: cualquier ruta que no sea un archivo devuelve index.html (React Router decide la pantalla)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/encabezados-seguridad.conf;
    }
}
