<!DOCTYPE html>
<!--
  Correo de un aviso (HU-24). Estilos en línea y tablas: así lo muestran bien los programas de correo.
  Colores del prototipo: acento #4f46e5, tinta #111827, texto suave #5b6270, borde #e5e7eb.
  th:text escapa el texto: lo que escriban los usuarios no se interpreta como HTML.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo}">Aviso de CoreTech Solutions</title>
</head>
<body style="margin:0; padding:0; background:#f3f4f6; font-family:'Segoe UI', Arial, sans-serif; color:#111827;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6; padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px; background:#ffffff; border:1px solid #e5e7eb; border-radius:12px;">
          <tr>
            <td style="padding:20px 28px; border-bottom:1px solid #e5e7eb; font-size:16px; font-weight:700;">
              CoreTech <span style="color:#4f46e5;">Solutions</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <p style="margin:0 0 16px; font-size:15px;" th:text="|Hola, ${nombre}:|">Hola, Laura:</p>
              <h1 style="margin:0 0 12px; font-size:20px; line-height:1.3;" th:text="${titulo}">Tu cita fue confirmada</h1>
              <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#374151;" th:text="${texto}">
                Texto del aviso.
              </p>
              <a th:if="${enlace != null}" th:href="${enlace}"
                 style="display:inline-block; padding:12px 20px; border-radius:8px; background:#4f46e5; color:#ffffff;
                        font-size:14px; font-weight:600; text-decoration:none;">Ver en el portal</a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px; border-top:1px solid #e5e7eb; font-size:12px; line-height:1.5; color:#5b6270;">
              Recibes este correo porque tienes una cuenta en el portal de
              <a th:href="${urlPortal}" style="color:#5b6270;">CoreTech Solutions</a>.
              No respondas a este mensaje: escríbenos desde el portal.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
